name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach release assets for"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            packages: musl-tools
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system packages
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tttui
      - name: Package the release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          stage="tttui-${TARGET}"
          binary="target/${TARGET}/release/tttui"
          if [ ! -f "${binary}" ]; then
            binary="${binary}.exe"
          fi

          rm -rf dist "${stage}"
          mkdir -p "dist/${stage}"
          cp "${binary}" "dist/${stage}/"
          cp LICENSE README.md "dist/${stage}/"

          tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
          rm -rf "dist/${stage}"
          ls -l dist
      - name: Assert the archive layout cargo-binstall expects
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          archive="dist/tttui-${TARGET}.tar.gz"
          listing="$(tar -tzf "${archive}")"
          echo "${listing}"
          printf '%s\n' "${listing}" | grep -qxE "tttui-${TARGET}/tttui(\.exe)?" || {
            echo "error: ${archive} must contain tttui-${TARGET}/tttui at its root" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tttui-${{ matrix.target }}.tar.gz
          path: dist/tttui-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        run: |
          set -euo pipefail

          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true

  publish:
    name: Publish crates
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$version"
      - run: cargo fmt --check
      - run: cargo check -p tttui
      - run: cargo test -p tttui
      - run: cargo package -p tttui_core
      - run: cargo publish -p tttui_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for tttui_core to become available
        run: |
          for attempt in {1..20}; do
            if cargo search tttui_core --limit 1 | grep -q '^tttui_core = '; then
              exit 0
            fi
            sleep 15
          done
          echo "tttui_core did not become visible on crates.io in time" >&2
          exit 1
      - run: cargo package -p tttui
      - run: cargo publish -p tttui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
