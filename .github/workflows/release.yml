name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach release assets for"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            packages: musl-tools
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system packages
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tttui
      - name: Package the release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          stage="tttui-${TARGET}"
          binary="target/${TARGET}/release/tttui"
          if [ ! -f "${binary}" ]; then
            binary="${binary}.exe"
          fi

          rm -rf dist "${stage}"
          mkdir -p "dist/${stage}"
          cp "${binary}" "dist/${stage}/"
          cp LICENSE README.md "dist/${stage}/"

          tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
          rm -rf "dist/${stage}"
          ls -l dist
      - name: Assert the archive layout cargo-binstall expects
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          archive="dist/tttui-${TARGET}.tar.gz"
          listing="$(tar -tzf "${archive}")"
          echo "${listing}"
          printf '%s\n' "${listing}" | grep -qxE "tttui-${TARGET}/tttui(\.exe)?" || {
            echo "error: ${archive} must contain tttui-${TARGET}/tttui at its root" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tttui-${{ matrix.target }}.tar.gz
          path: dist/tttui-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        run: |
          set -euo pipefail

          cd release-assets
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true

  publish:
    name: Publish crates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'ReidoBoss/tttui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify the tag matches the packaged version
        run: |
          set -euo pipefail

          version="$(cargo pkgid -p tttui | sed 's/.*[#@]//')"
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$version" || {
            echo "tag ${GITHUB_REF_NAME} does not match the packaged version ${version}" >&2
            exit 1
          }
      - run: cargo fmt --check
      - run: cargo check -p tttui
      - run: cargo test -p tttui
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # crates.io sparse index path for a crate name.
          index_path() {
            local crate="$1"
            case "${#crate}" in
              1) printf '1/%s' "$crate" ;;
              2) printf '2/%s' "$crate" ;;
              3) printf '3/%s/%s' "${crate:0:1}" "$crate" ;;
              *) printf '%s/%s/%s' "${crate:0:2}" "${crate:2:2}" "$crate" ;;
            esac
          }

          index_has_version() {
            local crate="$1" version="$2" index needle
            needle="\"vers\":\"${version}\""
            index="$(curl -fsS "https://index.crates.io/$(index_path "$crate")" 2>/dev/null || true)"
            [[ "$index" == *"$needle"* ]]
          }

          # The index lags behind a fresh publish; wait for the exact version
          # instead of for the crate name, which exists since the first release.
          wait_for_version() {
            local crate="$1" version="$2"
            for _ in $(seq 1 40); do
              if index_has_version "$crate" "$version"; then
                echo "${crate} ${version} is on the index"
                return 0
              fi
              sleep 15
            done
            echo "${crate} ${version} did not reach index.crates.io in time" >&2
            return 1
          }

          # Re-running a release must not fail on an already published version.
          publish() {
            local crate="$1" version
            version="$(cargo pkgid -p "$crate" | sed 's/.*[#@]//')"

            if index_has_version "$crate" "$version"; then
              echo "${crate} ${version} is already published; skipping"
              return 0
            fi

            cargo package -p "$crate"
            cargo publish -p "$crate"
            wait_for_version "$crate" "$version"
          }

          publish tttui_core
          publish tttui

